<!doctype html><html><head><meta charset="utf-8"><style>/*FONTS*/
*{box-sizing:border-box;margin:0;padding:0}html,body{width:720px;height:1280px;overflow:hidden;background:#000;color:#fff;font-family:Oswald,Arial,sans-serif}
canvas{position:absolute;inset:0}
.bug{position:absolute;top:28px;left:22px;right:22px;height:78px;display:flex;align-items:stretch;border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.5);font-family:Anton}
.bug .t{flex:1;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:30px}.bug .t b{font-size:44px;font-weight:400}
.bug .mid{width:140px;background:#0b0f16;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Oswald;font-weight:700;font-size:20px;letter-spacing:.08em}.bug .mid small{color:#c6ff3d;font-size:15px}
.brand{position:absolute;top:116px;left:24px;font-family:Anton;font-size:24px;letter-spacing:.05em;text-shadow:0 2px 8px #000}.brand em{font-style:normal;color:#c6ff3d}
.cap{position:absolute;left:22px;right:22px;bottom:40px;border-radius:16px;background:rgba(6,8,11,.86);padding:16px 20px;border-left:10px solid var(--c,#c6ff3d)}
.cap .k{font-size:18px;font-weight:700;letter-spacing:.16em;color:#c6ff3d}.cap .h{font-family:Anton;font-size:40px;line-height:1.05;margin-top:2px}
.cap .fp{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.cap .fp i{font-style:normal;background:#c6ff3d;color:#0b1100;font-weight:800;font-size:19px;padding:4px 12px;border-radius:99px}
.slam{position:absolute;left:0;right:0;top:420px;text-align:center;font-family:Anton;font-size:128px;line-height:1;color:#fff;-webkit-text-stroke:6px #0b1100;paint-order:stroke;text-shadow:0 10px 40px rgba(0,0,0,.6);opacity:0}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(80% 60% at 50% 40%,rgba(198,255,61,.22),rgba(6,8,11,.92) 70%);opacity:0}
.card h1{font-family:Anton;font-weight:400;font-size:96px;line-height:1}.card h1 em{font-style:normal;color:#c6ff3d}.card p{font-size:28px;letter-spacing:.18em;margin-top:14px;color:#c9ced6}
.card .sc{font-family:Anton;font-size:120px;margin-top:20px}.card .fz{margin-top:24px;font-size:26px;letter-spacing:.1em}.card .fz b{color:#c6ff3d}
</style></head><body>
<div id="ov"><div class="bug" id="bug"></div><div class="brand"><em>SMASH</em> NEWS · 3D REPLAY</div><div class="cap" id="cap"></div><div class="slam" id="slam"></div><div class="card" id="card"></div></div>
<script type="module">
import * as THREE from './three.module.min.js';
const $=(s)=>document.querySelector(s);const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));const seg=(t,a,b)=>clamp((t-a)/(b-a));
const ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;const oc=p=>1-Math.pow(1-p,3);const ob=p=>1+2.70158*Math.pow(p-1,3)+1.70158*Math.pow(p-1,2);const lerp=(a,b,p)=>a+(b-a)*p;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const W=720,H=1280;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(W,H);renderer.setPixelRatio(1);document.body.prepend(renderer.domElement);
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color('#14243a');scene.fog=new THREE.Fog('#14243a',120,260);
const cam=new THREE.PerspectiveCamera(50,W/H,0.5,600);cam.up.set(0,0,1);
scene.add(new THREE.HemisphereLight('#dfefff','#2b3d1b',1.4));const sun=new THREE.DirectionalLight('#ffffff',1.6);sun.position.set(-40,-60,90);scene.add(sun);
// toon gradient for the cartoon look
const gm=new THREE.DataTexture(new Uint8Array([90,90,90,255,170,170,170,255,255,255,255,255]),3,1);gm.needsUpdate=true;gm.minFilter=gm.magFilter=THREE.NearestFilter;
const toon=(c)=>new THREE.MeshToonMaterial({color:c,gradientMap:gm});
let G,PLAYS,TL,teams={};

function fieldTexture(away,home){
  const c=document.createElement('canvas');c.width=2400;c.height=1060;const x=c.getContext('2d');
  const px=(yd)=>(yd+60)/120*2400;
  for(let i=0;i<24;i++){x.fillStyle=i%2?'#3f8f3a':'#479d40';x.fillRect(px(-60+i*5),0,px(-55)-px(-60)+1,1060);}
  x.fillStyle=away.color;x.fillRect(0,0,px(-50),1060);x.fillStyle=home.color;x.fillRect(px(50),0,2400-px(50),1060);
  x.strokeStyle='#fff';x.lineWidth=6;for(let yd=-50;yd<=50;yd+=5){x.beginPath();x.moveTo(px(yd),20);x.lineTo(px(yd),1040);x.stroke();}
  x.lineWidth=10;x.strokeRect(6,20,2388,1020);
  x.fillStyle='#fff';x.font='bold 64px Anton, Impact';x.textAlign='center';x.textBaseline='middle';
  for(let yd=-40;yd<=40;yd+=10){const n=50-Math.abs(yd);x.fillText(String(n),px(yd),150);x.save();x.translate(px(yd),910);x.rotate(Math.PI);x.fillText(String(n),0,0);x.restore();}
  x.font='bold 150px Anton, Impact';x.fillStyle='rgba(255,255,255,.92)';
  for(const [t,yd,r] of [[away,-55,-Math.PI/2],[home,55,Math.PI/2]]){x.save();x.translate(px(yd),530);x.rotate(r);x.fillText(t.abbr,0,0);x.restore();}
  x.fillStyle='rgba(198,255,61,.9)';x.font='bold 90px Anton, Impact';x.save();x.translate(px(0),530);x.fillText('SMASH',0,0);x.restore();
  const tx=new THREE.CanvasTexture(c);tx.colorSpace=THREE.SRGBColorSpace;tx.anisotropy=8;return tx;}
function crowdTexture(){const c=document.createElement('canvas');c.width=512;c.height=256;const x=c.getContext('2d');x.fillStyle='#1d2430';x.fillRect(0,0,512,256);
  const cols=['#c9ced6','#ff5a4f','#22c3ee','#ffd400','#ffffff','#8b7dff','#ff9f1c'];for(let i=0;i<5000;i++){x.fillStyle=cols[i%cols.length];x.globalAlpha=.55;x.fillRect((i*97)%512,(i*53)%256,3,3);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(8,2);t.colorSpace=THREE.SRGBColorSpace;return t;}

// ---- NFL-style cartoon player: helmet + facemask cage, shoulder pads, numbered jersey, pants, socks, cleats, gloves.
// Built Y-up inside `inner`, which is turned so Y-up becomes the world's Z-up; the player faces +x.
const SKINS=['#8d5524','#c68642','#e0ac69','#f1c27d','#5c3a1e','#a0673c'];
function numTex(){const c=document.createElement('canvas');c.width=256;c.height=128;const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return {c,t};}
function drawNum(nt,num,bg,fg,trim){const x=nt.c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,256,128);
  x.fillStyle=trim;x.fillRect(0,0,256,10);x.font='bold 74px Anton, Impact';x.textAlign='center';x.textBaseline='middle';x.lineWidth=7;x.strokeStyle=trim;
  for(const u of [64,192]){x.strokeText(String(num),u,72);x.fillStyle=fg;x.fillText(String(num),u,72);}nt.t.needsUpdate=true;}
function makePlayer(){
  const g=new THREE.Group(),inner=new THREE.Group();inner.rotation.x=Math.PI/2;g.add(inner);
  const M={jersey:toon('#888'),pants:toon('#eee'),helm:toon('#888'),sock:toon('#888'),trim:toon('#fff'),skin:toon('#c68642'),glove:toon('#fff'),mask:toon('#e8e8e8'),black:toon('#151515')};
  const nt=numTex();const torsoMat=new THREE.MeshToonMaterial({map:nt.t,gradientMap:gm});
  const add=(geo,mat,x,y,z,parent=inner)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);parent.add(m);return m;};
  // torso: wide at the shoulders, narrow at the waist, number front and back
  const torso=add(new THREE.CylinderGeometry(0.66,0.46,1.15,20,1),torsoMat,0,2.05,0);torso.scale.set(0.82,1,1);
  // shoulder pads (big and boxy, the football look)
  const pads=add(new THREE.SphereGeometry(1,16,10),M.jersey,0,2.62,0);pads.scale.set(0.62,0.34,0.98);
  for(const s of [-1,1]){const cap=add(new THREE.SphereGeometry(0.34,12,8),M.jersey,0,2.6,s*0.82);cap.scale.set(1,0.75,1);}
  add(new THREE.CylinderGeometry(0.47,0.47,0.14,18),M.trim,0,1.5,0).scale.set(0.82,1,1); // belt line
  add(new THREE.CylinderGeometry(0.2,0.22,0.3,10),M.skin,0,2.9,0); // neck
  // helmet with center stripe, ear holes and a facemask cage
  const helmet=add(new THREE.SphereGeometry(0.52,20,14),M.helm,0.02,3.28,0);helmet.scale.set(1.12,1.0,0.98);
  const stripe=add(new THREE.TorusGeometry(0.535,0.07,6,24,Math.PI),M.trim,0.02,3.28,0);stripe.scale.set(1.12,1,1.12);
  for(const s of [-1,1])add(new THREE.CircleGeometry(0.09,10),M.black,0.04,3.22,s*0.515).rotation.y=s>0?0:Math.PI;
  add(new THREE.SphereGeometry(0.37,14,10),M.skin,0.28,3.18,0).scale.set(0.6,0.9,0.85); // face
  const bar=(len,x,y,z,rx,ry,rz)=>{const m=add(new THREE.CylinderGeometry(0.035,0.035,len,6),M.mask,x,y,z);m.rotation.set(rx,ry,rz);return m;};
  bar(0.78,0.56,3.17,0,Math.PI/2,0,0);bar(0.7,0.58,3.0,0,Math.PI/2,0,0);bar(0.55,0.55,2.86,0,Math.PI/2,0,0); // horizontal bars
  bar(0.36,0.58,3.02,0,0,0,0.12);for(const s of [-1,1])bar(0.45,0.5,3.03,s*0.34,0,0,0.25);                         // vertical bars
  // arms: sleeve (jersey) -> forearm (skin) -> glove
  const arms=[],legs=[];
  for(const s of [-1,1]){
    const arm=new THREE.Group();arm.position.set(0,2.62,s*0.9);inner.add(arm);
    add(new THREE.CapsuleGeometry(0.2,0.32,4,10),M.jersey,0,-0.25,0,arm);add(new THREE.CapsuleGeometry(0.155,0.42,4,10),M.skin,0,-0.72,0,arm);add(new THREE.SphereGeometry(0.19,10,8),M.glove,0,-1.06,0,arm);arms.push(arm);
    const leg=new THREE.Group();leg.position.set(0,1.45,s*0.27);inner.add(leg);
    add(new THREE.CapsuleGeometry(0.25,0.42,4,10),M.pants,0,-0.32,0,leg);                       // thigh (pants)
    add(new THREE.BoxGeometry(0.06,0.5,0.06),M.trim,0,-0.32,s*0.25,leg);                        // pants stripe
    add(new THREE.CapsuleGeometry(0.18,0.42,4,10),M.sock,0,-0.86,0,leg);                        // socks
    const cleat=add(new THREE.BoxGeometry(0.5,0.2,0.28),M.black,0.1,-1.28,0,leg);cleat.geometry.translate(0,0,0);legs.push(leg);}
  const sh=new THREE.Mesh(new THREE.CircleGeometry(0.85,16),new THREE.MeshBasicMaterial({color:'#000',transparent:true,opacity:.3}));sh.position.z=0.03;g.add(sh);
  g.rotation.order='ZYX';g.userData={legs,arms,inner,shadow:sh,M,nt,skin:M.skin};g.scale.setScalar(1.05);return g;}
// NFL uniforms: home team in dark jerseys, road team in white with team-colored numbers
function dress(p,team,home,num,k){const M=p.userData.M;const c=team.color,alt=team.alt&&team.alt.toLowerCase()!==c.toLowerCase()?team.alt:'#ffffff';
  const jersey=home?c:'#f4f4f4',numFg=home?(lum(alt)>0.55?alt:'#ffffff'):c,trim=home?alt:c;
  M.jersey.color.set(jersey);M.helm.color.set(c);M.sock.color.set(home?c:c);M.trim.color.set(trim);M.pants.color.set(home?'#f2f2f2':(lum(alt)<0.85?alt:'#d9d9d9'));
  M.glove.color.set(home?'#f4f4f4':c);M.skin.color.set(SKINS[k%SKINS.length]);drawNum(p.userData.nt,num,jersey,numFg,trim);}
function lum(hex){const c=new THREE.Color(hex);return 0.2126*c.r+0.7152*c.g+0.0722*c.b;}
function pose(p,{x,y,z=0,face=0,run=0,phase=0,dive=0,jump=0,armsUp=0,crouch=0}){
  p.position.set(x,y,z+Math.max(0,jump)-crouch*0.35);p.rotation.z=face;p.rotation.y=dive+crouch*0.35;
  const s=Math.sin(phase)*run;const L=p.userData.legs,A=p.userData.arms;
  L[0].rotation.z=s*0.85+crouch*0.5;L[1].rotation.z=-s*0.85+crouch*0.5;
  A[0].rotation.z=-s*0.8+armsUp*2.7+crouch*0.6;A[1].rotation.z=s*0.8+armsUp*2.7+crouch*0.6;
  p.userData.shadow.position.z=0.03-Math.max(0,jump)-z;}

const ball=new THREE.Mesh(new THREE.SphereGeometry(0.42,16,10),toon('#7a3e17'));ball.scale.set(1.5,1,1);scene.add(ball);
let off=[],def=[],posts,confetti;

window.setup=async(d)=>{G=d.game;PLAYS=d.plays;TL=d.timeline;
  teams={away:G.away,home:G.home};
  const field=new THREE.Mesh(new THREE.PlaneGeometry(120,53.3),new THREE.MeshLambertMaterial({map:fieldTexture(G.away,G.home)}));scene.add(field);
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,300),new THREE.MeshLambertMaterial({color:'#2f6b2a'}));ground.position.z=-0.05;scene.add(ground);
  const ct=crowdTexture();
  for(const [x,y,w,rz] of [[0,-44,150,0],[0,44,150,Math.PI],[-78,0,90,-Math.PI/2],[78,0,90,Math.PI/2]]){const st=new THREE.Mesh(new THREE.PlaneGeometry(w,30),new THREE.MeshLambertMaterial({map:ct}));st.position.set(x,y,12);st.rotation.set(Math.PI/2-0.6,0,rz);
    if(rz===0)st.rotation.set(Math.PI/2-0.6,0,0);if(rz===Math.PI)st.rotation.set(-(Math.PI/2-0.6),0,0),st.position.y=44;
    if(Math.abs(rz)===Math.PI/2){st.rotation.set(0,0,0);st.rotation.order='ZXY';st.rotation.z=rz;st.rotation.x=Math.PI/2-0.6;}scene.add(st);}
  // goal posts at both ends
  posts=new THREE.Group();const yel=toon('#ffd400');
  for(const X of [-60,60]){const g=new THREE.Group();const base=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.25,10,8),yel);base.rotation.x=Math.PI/2;base.position.z=5;g.add(base);
    const cb=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,18.5,8),yel);cb.position.z=10;g.add(cb);
    for(const s of [-1,1]){const up=new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.18,20,8),yel);up.rotation.x=Math.PI/2;up.position.set(0,s*9.25,20);g.add(up);}g.position.x=X;posts.add(g);}scene.add(posts);
  for(let i=0;i<11;i++){const p=makePlayer();scene.add(p);off.push(p);}for(let i=0;i<11;i++){const p=makePlayer();scene.add(p);def.push(p);}
  confetti=new THREE.InstancedMesh(new THREE.PlaneGeometry(0.5,0.3),new THREE.MeshBasicMaterial({color:'#ffffff',side:THREE.DoubleSide}),300);scene.add(confetti);
  await document.fonts.ready;return true;};

// jersey numbers by spot (real number for the scorer and the QB when ESPN has it)
const OFFN=[[1,3,7,9,10,12,14,15,16],[0,1,2,4,5,8,10,11,13,17,18,19,81,84,88],[71,64,55,62,76],[62,66,52,68,74],[77,73,65,54,70],[68,72,63,60,75],[74,79,67,61,78],[85,87,86,89,80],[11,13,17,18,19,15],[10,12,14,16,83],[21,22,26,28,30,33,34]];
const DEFN=[[90,91,94,99],[93,95,97,98],[92,96,90,91],[99,97,94,95],[50,54,56,58],[52,53,55,57],[44,45,48,51],[21,22,23,24],[20,24,25,26,29],[31,32,33,36],[27,37,38,39,42]];
const KN=[1,2,3,4,5,6,9];
let lastPlay=-1;
function dressPlay(pl){const offT=teams[pl.side],dside=pl.side==='away'?'home':'away',defT=teams[dside],h=pl._i*7;
  off.forEach((p,i)=>{let n=OFFN[i][(h+i)%OFFN[i].length];if(i===1&&pl.num)n=pl.num;if(i===1&&pl.kind==='fg')n=pl.num||KN[h%KN.length];if(i===0&&pl.qbNum)n=pl.qbNum;dress(p,offT,pl.side==='home',n,h+i);});
  def.forEach((p,i)=>dress(p,defT,dside==='home',DEFN[i][(h+i*3)%DEFN[i].length],h+i*5+3));}
function playScene(pl,lt){ // offense always attacks +x toward the x=50 goal line; full 11 v 11
  const D=pl.dur;const yd=Math.min(99,Math.max(1,pl.yards||1));const los=pl.kind==='fg'?50-(yd-17):50-yd;
  if(pl._i!==lastPlay){lastPlay=pl._i;dressPlay(pl);}
  const snap=0.6;let bx=los,by=0,bz=1.2,cx=los,scoreAt=D-1.6;const after=t=>lt>t;
  // offensive line (2-6): fire out and block
  for(let i=2;i<7;i++){const yy=(i-4)*1.5;const push=ease(seg(lt,snap,snap+1.2))*1.4;pose(off[i],{x:los-0.9+push,y:yy,run:after(snap)?0.35:0,phase:lt*10+i,crouch:after(snap)?0.6:1});}
  // defensive front (0-3) engages the line, then everyone pursues the ball
  const pursue=(p,i,sx,sy,delay,lag)=>{const q=seg(lt,snap+delay,D);const tx=lerp(sx,bx-lag-(i%3)*1.3,ease(q)),ty=lerp(sy,by+((i%5)-2)*1.4,ease(q));
    const dive=lt>scoreAt-0.6&&i%3===0?clamp((lt-(scoreAt-0.6))*3,0,1.25):0;
    pose(p,{x:tx,y:ty,face:Math.atan2(by-ty,bx-tx),run:after(snap)?0.9:0,phase:lt*13+i,dive,z:dive>0?-dive*0.55:0,crouch:lt<snap?0.7:0});};
  if(pl.kind==='pass'){
    const throwT=snap+1.3,flight=clamp(yd/28,0.7,1.6),catchT=throwT+flight;const cX=Math.min(47,los+Math.max(4,yd*0.7)),cY=6;
    const qx=lerp(los-4.5,los-8,ease(seg(lt,snap,throwT)));pose(off[0],{x:qx,y:0,run:lt>snap&&lt<throwT?0.6:0,phase:lt*12,armsUp:lt>throwT-0.3&&lt<throwT+0.3?1:0});
    const rStart=[los-0.5,14];const rx=lt<catchT?lerp(rStart[0],cX,ease(seg(lt,snap,catchT))):lerp(cX,55,ease(seg(lt,catchT,scoreAt)));const ry=lt<catchT?lerp(rStart[1],cY,ease(seg(lt,snap,catchT))):lerp(cY,2,seg(lt,catchT,scoreAt));
    pose(off[1],{x:rx,y:ry,face:lt<catchT?Math.atan2(cY-rStart[1],cX-rStart[0]):0,run:lt>snap&&lt<scoreAt?1:0,phase:lt*14,armsUp:lt>catchT-0.25&&lt<catchT+0.15?1:lt>scoreAt?1:0,jump:lt>scoreAt?Math.abs(Math.sin((lt-scoreAt)*6))*1.6:0});
    if(lt<throwT){bx=qx+0.6;by=0.5;bz=lt<snap?0.6:2.7;}else if(lt<catchT){const p=seg(lt,throwT,catchT);bx=lerp(qx,cX,p);by=lerp(0,cY,p);bz=2.8+Math.sin(p*Math.PI)*(4+yd*0.18);}else{bx=rx+0.4;by=ry;bz=2.3;}
    cx=lt<throwT?los:lt<catchT?lerp(los,cX,seg(lt,throwT,catchT)):rx;
    // other routes: TE seam, outside WR go route, slot crosser; RB stays in to block
    const route=(p,sx,sy,ex,ey,k)=>{const q=ease(seg(lt,snap,D-0.4));pose(p,{x:lerp(sx,ex,q),y:lerp(sy,ey,q),face:Math.atan2(ey-sy,ex-sx),run:after(snap)&&q<1?1:0,phase:lt*14+k,crouch:lt<snap?0.4:0});};
    route(off[7],los-0.9,-4.8,Math.min(58,los+16),-6,1);route(off[8],los-0.5,-17,Math.min(58,los+22),-16,2);route(off[9],los-1.5,8.5,Math.min(58,los+10),-2,3);
    pose(off[10],{x:qx+1.2,y:1.6,face:0.2,run:0.2,phase:lt*8,crouch:0.5});
  }else if(pl.kind==='fg'){
    const kickT=snap+1.0,flight=clamp(yd/22,1.0,2.2);
    pose(off[0],{x:los-7,y:0.6,face:Math.PI,crouch:1});
    const kx=lerp(los-10,los-7.4,seg(lt,snap,kickT));pose(off[1],{x:kx,y:-1.5,face:0.3,run:lt>snap&&lt<kickT?1:0,phase:lt*14,armsUp:lt>kickT&&lt>kickT+flight*0.85?1:0});
    if(lt<snap){bx=los;bz=0.5}else if(lt<kickT){bx=los-7;by=0;bz=0.5}else{const p=seg(lt,kickT,kickT+flight);bx=lerp(los-7,61,p);by=0;bz=0.5+Math.sin(p*Math.PI*0.62)*(13+yd*0.15);}
    cx=lt<kickT?los-5:bx;scoreAt=kickT+flight*0.85;
    pose(off[7],{x:los-1.2,y:-4.8,crouch:0.8});pose(off[8],{x:los-1.2,y:4.8,crouch:0.8});pose(off[9],{x:los-1.6,y:-6.2,crouch:0.8});pose(off[10],{x:los-1.6,y:6.2,crouch:0.8});
  }else{ // run / return
    const handT=snap+0.6,runEnd=Math.max(handT+0.8,scoreAt);const qx=los-4.5;pose(off[0],{x:qx,y:0,run:0,face:lt>handT?-0.6:0});
    const rx=lt<handT?lerp(los-6.5,qx-0.4,seg(lt,snap,handT)):lerp(qx,55,ease(seg(lt,handT,runEnd)));const ry=lt<handT?lerp(1.5,0.3,seg(lt,snap,handT)):Math.sin((rx-los)*0.25)*3;
    pose(off[1],{x:rx,y:ry,run:lt>snap&&lt<runEnd?1:0,phase:lt*15,jump:lt>scoreAt?Math.abs(Math.sin((lt-scoreAt)*6))*1.6:0,armsUp:lt>scoreAt?1:0});
    if(lt<handT){bx=lt<snap?los:qx;by=0;bz=lt<snap?0.6:2.4}else{bx=rx+0.4;by=ry;bz=2.3;}cx=lt<handT?los:rx;
    // lead blockers run ahead of the ball carrier
    const lead=(p,sx,sy,k,ahead,side)=>{const q=ease(seg(lt,snap,runEnd));pose(p,{x:lerp(sx,Math.min(56,rx+ahead),q),y:lerp(sy,ry+side,q),run:after(snap)?1:0,phase:lt*14+k,crouch:lt<snap?0.4:0});};
    lead(off[7],los-0.9,-4.8,1,2.5,-2);lead(off[8],los-0.5,-17,2,5,-4);lead(off[9],los-1.5,8.5,3,4,3);pose(off[10],{x:los-5,y:-1.6,face:0,run:after(snap)?0.6:0,phase:lt*12});
  }
  // defense: 4 down linemen, 3 linebackers, 2 corners, 2 safeties
  const DS=[[los+0.9,-2.6,0.1,1.2],[los+0.9,-0.8,0.1,1.4],[los+0.9,0.9,0.1,1.6],[los+0.9,2.7,0.1,1.3],[los+5,-5,0.2,2.0],[los+5,0,0.2,2.4],[los+5,5,0.2,2.2],[los+6,-16,0.3,2.8],[los+6,15,0.3,3.0],[los+13,-7,0.4,3.4],[los+13,7,0.4,3.2]];
  DS.forEach(([sx,sy,dl,lag],i)=>pursue(def[i],i,Math.min(sx,59),sy,dl,lag));
  ball.position.set(bx,by,bz);ball.rotation.set(0,lt*6,0);
  return {cx,bx,by,scoreAt,los};}

function camFollow(cx,lt,pl,scoreAt){ // behind-the-play broadcast cam that swings to the sideline for the score
  const s=ease(seg(lt,scoreAt-1.0,scoreAt+0.4));
  const behind=new THREE.Vector3(cx-24,-5,16),side=new THREE.Vector3(cx-3,-27,12);const p=behind.lerp(side,s);
  cam.position.copy(p);cam.lookAt(new THREE.Vector3(cx+lerp(16,1,s),0,lerp(0,2,s)));}

window.frame=(t)=>{
  const sc=TL.find(s=>t>=s.start&&t<s.start+s.dur)||TL[TL.length-1];const lt=t-sc.start;
  const card=$('#card'),slam=$('#slam'),cap=$('#cap'),bug=$('#bug');
  if(sc.kind==='intro'){ // stadium flyover
    // both teams lined up for the first scoring play, camera sweeps around them
    for(const p of [...off,...def])p.visible=true;ball.visible=true;const r0=playScene(PLAYS[0],0);
    const a=-2.6+lt*0.45,R=lerp(34,20,ease(seg(lt,0,sc.dur)));cam.position.set(r0.los+Math.cos(a)*R,Math.sin(a)*R,lerp(22,9,ease(seg(lt,0,sc.dur))));cam.lookAt(r0.los,0,1.5);
    card.style.opacity=lt<1.4?1:1-seg(lt,1.4,2.0);card.innerHTML=`<h1>${esc(G.away.name)}<br><em>VS</em><br>${esc(G.home.name)}</h1><p>${G.week?`WEEK ${G.week} · `:''}EVERY SCORE IN 3D</p>`;
    card.querySelector('h1').style.transform=`scale(${2-ob(seg(lt,0.2,0.8))})`;cap.style.opacity=0;bug.style.opacity=0;slam.style.opacity=0;}
  else if(sc.kind==='outro'){
    const a=lt*0.25+1;cam.position.set(Math.cos(a)*60,Math.sin(a)*60,35);cam.lookAt(0,0,0);for(const p of [...off,...def])p.visible=false;ball.visible=false;
    card.style.opacity=seg(lt,0,0.5);const w=+G.away.score>+G.home.score?G.away:G.home;
    card.innerHTML=`<p>FINAL</p><div class="sc">${esc(G.away.abbr)} ${esc(G.away.score)} – ${esc(G.home.score)} ${esc(G.home.abbr)}</div>${G.fantasy?`<div class="fz">FANTASY: ${esc(G.away.abbr)} <b>${G.fantasy.away.total.toFixed(1)}</b> · ${esc(G.home.abbr)} <b>${G.fantasy.home.total.toFixed(1)}</b></div>`:''}<p style="color:#c6ff3d">SMASH NEWS</p>`;
    cap.style.opacity=0;slam.style.opacity=0;}
  else{
    card.style.opacity=0;for(const p of [...off,...def])p.visible=true;ball.visible=true;
    const pl=PLAYS[sc.i];const r=playScene(pl,lt);camFollow(r.cx,lt,pl,r.scoreAt);
    const prev=sc.i?PLAYS[sc.i-1]:{away:0,home:0};const scored=lt>r.scoreAt;const A=scored?pl.away:prev.away,Hm=scored?pl.home:prev.home;
    bug.style.opacity=1;bug.innerHTML=`<div class="t" style="background:${G.away.color}"><span>${esc(G.away.abbr)}</span><b>${A}</b></div><div class="mid">${esc(pl.q)}<small>${esc(pl.clock)}</small></div><div class="t" style="background:${G.home.color}"><b>${Hm}</b><span>${esc(G.home.abbr)}</span></div>`;
    cap.style.opacity=seg(lt,0.2,0.6);cap.style.setProperty('--c',teams[pl.side].color);
    cap.innerHTML=`<div class="k">${esc(pl.label)} · ${esc(teams[pl.side].name.toUpperCase())}</div><div class="h">${esc(pl.headline)}</div>${scored&&pl.fp.length?`<div class="fp">${pl.fp.map(f=>`<i>+${f.pts} ${esc(f.player)}</i>`).join('')}</div>`:''}`;
    const sp=seg(lt,r.scoreAt,r.scoreAt+0.5);slam.style.opacity=lt>r.scoreAt?1-seg(lt,r.scoreAt+1.6,r.scoreAt+2.0):0;slam.textContent=pl.kind==='fg'?'IT\'S GOOD!':'TOUCHDOWN!';slam.style.transform=`scale(${2.2-1.2*ob(sp)}) rotate(-4deg)`;
    // confetti burst in team colors
    const dummy=new THREE.Object3D();const col=new THREE.Color(teams[pl.side].color);confetti.material.color=col;confetti.visible=lt>r.scoreAt;
    for(let k=0;k<300;k++){const a=k*2.4,rr=(k%17)*0.9,u=lt-r.scoreAt;dummy.position.set(r.bx+Math.cos(a)*rr*u*1.5,r.by+Math.sin(a)*rr*u*1.5,4+u*(10-u*6)+(k%7));dummy.rotation.set(u*5+k,u*3,k);dummy.updateMatrix();confetti.setMatrixAt(k,dummy.matrix);}confetti.instanceMatrix.needsUpdate=true;}
  renderer.render(scene,cam);};
window.ready=true;
</script></body></html>
