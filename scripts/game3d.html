  ring.visible=!!carrier&&lt<scoreAt+1.5;if(carrier){ring.position.x=carrier.position.x;ring.position.y=carrier.position.y;ring.material.color.set(teams[pl.side].color);ring.material.color.lerp(new THREE.Color('#ffffff'),0.35);}
  return {cx:cpos[0],bx:ballP[0],by:ballP[1],bz:ballP[2],scoreAt,los,carrier,inAir,fg};}

// Madden-style camera: high behind the offense, following the ball; swings in tight for the celebration
const camS={};
function camFollow(r,lt,pl){
  const fx=r.bx,fy=r.by;let pos=new THREE.Vector3(fx-12.5,fy*0.45-1.5,r.fg?6.5:8),tgt=new THREE.Vector3(fx+6.5,fy*0.7,r.fg?Math.max(0.5,r.bz*0.55):0.4);
  const c=lt>r.scoreAt-0.1?1:0; // hard cut to the celebration camera, like a broadcast
  if(c>0){const h=r.fg?ball.position:off[1].position;const cp=r.fg?new THREE.Vector3(r.los-16,-1.5,4.2):new THREE.Vector3(h.x+4.2,h.y-5.0,2.0);const ct=r.fg?new THREE.Vector3(60,0,4.5):new THREE.Vector3(h.x,h.y,1.25);pos.lerp(cp,c);tgt.lerp(ct,c);}
  if(camS.scene!==CUR_SCENE||camS.c!==c){camS.scene=CUR_SCENE;camS.c=c;camS.p=pos.clone();camS.t=tgt.clone();}
  camS.p.lerp(pos,0.22);camS.t.lerp(tgt,0.3);cam.position.copy(camS.p);cam.lookAt(camS.t);
  ball.scale.setScalar(clamp(cam.position.distanceTo(ball.position)/16,0.8,1.25));
  sun.position.set(camS.t.x-30,-45,80);sun.target.position.set(camS.t.x,0,0);}

window.frame=(t,draw=true)=>{
  const sc=TL.find(s=>t>=s.start&&t<s.start+s.dur)||TL[TL.length-1];const lt=t-sc.start;CUR_T=t;CUR_SCENE=TL.indexOf(sc);
  const card=$('#card'),slam=$('#slam'),cap=$('#cap'),bug=$('#bug');
  if(sc.kind==='intro'){ // stadium flyover
    // both teams lined up for the first scoring play, camera sweeps around them
    for(const p of [...off,...def])p.visible=true;ball.visible=true;const r0=playScene(PLAYS[0],0);
    const a=-2.6+lt*0.45,R=lerp(26,11,ease(seg(lt,0,sc.dur)));cam.position.set(r0.los+Math.cos(a)*R,Math.sin(a)*R,lerp(14,3.5,ease(seg(lt,0,sc.dur))));cam.lookAt(r0.los,0,1);sun.position.set(r0.los-30,-45,80);sun.target.position.set(r0.los,0,0);
    card.style.opacity=lt<1.4?1:1-seg(lt,1.4,2.0);card.innerHTML=`<h1>${esc(G.away.name)}<br><em>VS</em><br>${esc(G.home.name)}</h1><p>${G.week?`WEEK ${G.week} · `:''}EVERY SCORE IN 3D</p>`;
    card.querySelector('h1').style.transform=`scale(${2-ob(seg(lt,0.2,0.8))})`;cap.style.opacity=0;bug.style.opacity=0;slam.style.opacity=0;}
  else if(sc.kind==='outro'){
    const a=lt*0.25+1;cam.position.set(Math.cos(a)*60,Math.sin(a)*60,35);cam.lookAt(0,0,0);for(const p of [...off,...def])p.visible=false;ball.visible=false;ring.visible=false;losLine.visible=false;fdLine.visible=false;trail.forEach(s=>s.material.opacity=0);
    card.style.opacity=seg(lt,0,0.5);const w=+G.away.score>+G.home.score?G.away:G.home;
    card.innerHTML=`<p>FINAL</p><div class="sc">${esc(G.away.abbr)} ${esc(G.away.score)} – ${esc(G.home.score)} ${esc(G.home.abbr)}</div>${G.fantasy?`<div class="fz">FANTASY: ${esc(G.away.abbr)} <b>${G.fantasy.away.total.toFixed(1)}</b> · ${esc(G.home.abbr)} <b>${G.fantasy.home.total.toFixed(1)}</b></div>`:''}<p style="color:#c6ff3d">SMASH NEWS</p>`;
    cap.style.opacity=0;slam.style.opacity=0;}
  else{
    card.style.opacity=0;for(const p of [...off,...def])p.visible=true;ball.visible=true;
    const pl=PLAYS[sc.i];const r=playScene(pl,lt);camFollow(r,lt,pl);
    const prev=sc.i?PLAYS[sc.i-1]:{away:0,home:0};const scored=lt>r.scoreAt;const A=scored?pl.away:prev.away,Hm=scored?pl.home:prev.home;
    bug.style.opacity=1;bug.innerHTML=`<div class="t" style="background:${G.away.color}"><span>${esc(G.away.abbr)}</span><b>${A}</b></div><div class="mid">${esc(pl.q)} · ${esc(pl.clock)}<small>${esc(((pl.det||{}).ddText||'').replace(/ at .*/,'').toUpperCase()||pl.label)}</small></div><div class="t" style="background:${G.home.color}"><b>${Hm}</b><span>${esc(G.home.abbr)}</span></div>`;
    cap.style.opacity=seg(lt,0.2,0.6);cap.style.setProperty('--c',teams[pl.side].color);
    cap.innerHTML=`<div class="k">${esc(pl.label)} · ${esc(teams[pl.side].name.toUpperCase())}</div><div class="h">${esc(pl.headline)}</div>${scored&&pl.fp.length?`<div class="fp">${pl.fp.map(f=>`<i>+${f.pts} ${esc(f.player)}</i>`).join('')}</div>`:''}`;
    const sp=seg(lt,r.scoreAt,r.scoreAt+0.5);slam.style.opacity=lt>r.scoreAt?1-seg(lt,r.scoreAt+1.6,r.scoreAt+2.0):0;slam.textContent=pl.kind==='fg'?'IT\'S GOOD!':'TOUCHDOWN!';slam.style.transform=`scale(${2.2-1.2*ob(sp)}) rotate(-4deg)`;
    // confetti burst in team colors
    const dummy=new THREE.Object3D();const col=new THREE.Color(teams[pl.side].color);confetti.material.color=col;confetti.visible=lt>r.scoreAt;
    for(let k=0;k<300;k++){const a=k*2.4,rr=(k%17)*0.9,u=lt-r.scoreAt;dummy.position.set(r.bx+Math.cos(a)*rr*u*1.5,r.by+Math.sin(a)*rr*u*1.5,4+u*(10-u*6)+(k%7));dummy.rotation.set(u*5+k,u*3,k);dummy.updateMatrix();confetti.setMatrixAt(k,dummy.matrix);}confetti.instanceMatrix.needsUpdate=true;}
  if(window.CAM){cam.position.set(...window.CAM.p);cam.lookAt(...window.CAM.t);}
  if(draw)renderer.render(scene,cam);};
window._dbg=()=>{const h=new THREE.Vector3();off[1].userData.bones.hips.getWorldPosition(h);const hd=new THREE.Vector3();off[1].userData.bones.chest.getWorldPosition(hd);return {pos:off[1].position.toArray(),hips:h.toArray(),chest:hd.toArray(),ball:ball.position.toArray(),cam:cam.position.toArray(),vis:off[1].visible};};
window.ready=true;
</script></body></html>
