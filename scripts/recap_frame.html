<!doctype html>
<html><head><meta charset="utf-8"><style>
/*FONTS*/
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:720px;height:1280px;overflow:hidden;background:#000;color:#fff;font-family:Oswald,'Helvetica Neue',Arial,sans-serif}
#stage{position:absolute;inset:0;overflow:hidden;background:#07080b}
#bg{position:absolute;inset:-10%;}
#streaks i{position:absolute;top:-20%;height:140%;transform:skewX(-18deg);background:linear-gradient(180deg,transparent,rgba(255,255,255,.13),transparent)}
#grain{position:absolute;inset:-50%;opacity:.09;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#vig{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 45%,transparent 55%,rgba(0,0,0,.75));pointer-events:none}
#scene{position:absolute;inset:0}
#bug{position:absolute;top:34px;left:34px;right:34px;display:flex;align-items:center;gap:12px;z-index:20;font-weight:700;letter-spacing:.14em;font-size:20px}
#bug .logo{width:34px;height:34px;border-radius:50%;border:3px solid #c6ff3d;position:relative;box-shadow:0 0 18px rgba(198,255,61,.5)}
#bug .logo:after{content:'';position:absolute;inset:8px;border-radius:50%;background:#c6ff3d}
#bug b{font-family:Anton;font-weight:400;font-size:28px;letter-spacing:.06em}#bug b em{font-style:normal;color:#c6ff3d}
#bug .tag{margin-left:auto;background:#c6ff3d;color:#0b1100;padding:5px 12px;border-radius:4px;font-size:17px}
#wipe{position:absolute;top:-10%;height:120%;width:70%;z-index:30;transform:skewX(-14deg);background:#c6ff3d;box-shadow:-60px 0 0 #0b0f16,-120px 0 0 rgba(255,255,255,.9)}
.anton{font-family:Anton;font-weight:400;text-transform:uppercase;line-height:.92}
.abs{position:absolute}
/* open */
.slab{position:absolute;top:-10%;height:120%;width:110%;transform:skewX(-12deg)}
.final{position:absolute;left:0;right:0;top:470px;text-align:center;font-size:230px;letter-spacing:.02em;text-shadow:0 12px 40px rgba(0,0,0,.6)}
.osub{position:absolute;left:0;right:0;top:730px;text-align:center;font-size:34px;letter-spacing:.32em;font-weight:700}
.osub em{font-style:normal;color:#c6ff3d}
#flash{position:absolute;inset:0;background:#fff;z-index:25;pointer-events:none;opacity:0}
/* intro */
.half{position:absolute;left:0;right:0;height:640px;overflow:hidden}
.half .logo{position:absolute;width:300px;height:300px;background-size:contain;background-repeat:no-repeat;background-position:center;filter:drop-shadow(0 20px 40px rgba(0,0,0,.5))}
.half .nm{position:absolute;font-size:96px;letter-spacing:.01em}
.half .city{position:absolute;font-size:28px;letter-spacing:.2em;font-weight:500;opacity:.85}
.half .rec{position:absolute;font-size:26px;font-weight:700;letter-spacing:.12em;background:rgba(0,0,0,.35);padding:4px 12px;border-radius:4px}
.half .sc{position:absolute;font-size:250px}
.win{position:absolute;font-family:Anton;font-size:40px;background:#c6ff3d;color:#0b1100;padding:4px 16px;border-radius:6px;transform-origin:center}
.divider{position:absolute;left:-10%;width:120%;top:612px;height:56px;background:#c6ff3d;transform:skewY(-4deg);display:flex;align-items:center;justify-content:center;z-index:5;box-shadow:0 0 40px rgba(198,255,61,.45)}
.divider span{font-family:Anton;font-size:40px;color:#0b1100;letter-spacing:.3em;transform:skewY(4deg)}
/* box */
.ttl{position:absolute;left:50px;top:150px;font-size:74px}
.ttl:after{content:'';display:block;height:10px;width:var(--w,0);background:#c6ff3d;margin-top:14px}
.grid{position:absolute;left:40px;right:40px;top:400px}
.row{display:flex;align-items:center;height:150px;margin-bottom:22px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.06)}
.row.hd{height:60px;background:transparent;font-weight:700;font-size:28px;letter-spacing:.14em;color:#c9ced6}
.row .team{width:190px;height:100%;display:flex;align-items:center;gap:12px;padding-left:16px;font-family:Anton;font-size:44px}
.row .team i{width:70px;height:70px;background-size:contain;background-repeat:no-repeat;background-position:center}
.row .c{flex:1;text-align:center;font-family:Anton;font-size:64px}
.row .c.t{flex:1.3;font-size:80px;height:100%;display:flex;align-items:center;justify-content:center}
.row.hd .c{font-family:Oswald;font-size:28px}
/* play */
.wm{position:absolute;width:980px;height:980px;left:-120px;top:150px;background-size:contain;background-repeat:no-repeat;background-position:center;opacity:.09;transform:rotate(-12deg)}
.chip{position:absolute;left:50px;top:150px;font-size:30px;font-weight:700;letter-spacing:.16em;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.25);padding:8px 18px;border-radius:8px}
.chip em{font-style:normal;color:#c6ff3d}
.big{position:absolute;left:44px;top:250px;font-size:168px;white-space:nowrap;transform-origin:left center}
.big.trail{opacity:.18}
.who{position:absolute;left:52px;font-size:38px;font-weight:700;letter-spacing:.2em}
.ptext{position:absolute;left:50px;right:50px;font-size:58px;font-weight:700;line-height:1.18}
.ptext span{display:inline-block;margin-right:.24em}
.sbar{position:absolute;left:40px;right:40px;bottom:120px;height:150px;border-radius:18px;background:rgba(5,6,8,.82);border:2px solid rgba(255,255,255,.12);display:flex;align-items:center;padding:0 30px;gap:18px}
.sbar i{width:96px;height:96px;background-size:contain;background-repeat:no-repeat;background-position:center}
.sbar .s{font-family:Anton;font-size:96px;min-width:120px;text-align:center}
.sbar .ab{font-family:Anton;font-size:40px;color:#c9ced6}
.sbar .mid{flex:1;text-align:center;font-weight:700;letter-spacing:.2em;font-size:22px;color:#9aa3ad}
.dots{position:absolute;left:0;right:0;bottom:70px;text-align:center;font-size:22px;letter-spacing:.3em;font-weight:700;color:#9aa3ad}
/* stats */
.st{position:absolute;left:50px;right:50px}
.st h4{font-size:30px;letter-spacing:.2em;color:#c9ced6;margin-bottom:16px}
.bar{height:84px;border-radius:12px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-family:Anton;font-size:46px;white-space:nowrap;overflow:hidden}
.tov{display:flex;gap:30px}.tov div{flex:1;border-radius:14px;height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.07)}
.tov b{font-family:Anton;font-weight:400;font-size:110px}.tov span{font-size:26px;letter-spacing:.2em;font-weight:700}
/* leader */
.slash{position:absolute;left:-30%;width:160%;height:330px;top:270px;background:#c6ff3d;transform:skewY(-9deg);opacity:.95}
.lab{position:absolute;left:50px;top:150px;font-size:34px;font-weight:700;letter-spacing:.24em}
.lab em{font-style:normal;background:#c6ff3d;color:#0b1100;padding:2px 10px;border-radius:4px;margin-left:10px;font-size:26px}
.fn{position:absolute;left:50px;top:318px;font-size:64px;font-weight:700;letter-spacing:.06em;color:#0b1100;z-index:2}
.ln{position:absolute;left:44px;top:392px;font-size:170px;color:#0b1100;z-index:2;white-space:nowrap;transform-origin:left center}
.pos{position:absolute;left:52px;top:640px;font-size:30px;font-weight:700;letter-spacing:.2em}
.tiles{position:absolute;left:40px;right:40px;top:740px;display:flex;gap:18px}
.tile{flex:1;height:250px;border-radius:18px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center}
.tile b{font-family:Anton;font-weight:400;font-size:100px;line-height:1}.tile span{margin-top:10px;font-size:24px;letter-spacing:.2em;font-weight:700;color:#c6ff3d}
/* outro */
.olock{position:absolute;left:40px;right:40px;top:380px;display:flex;align-items:center;justify-content:space-between}
.olock .t{display:flex;flex-direction:column;align-items:center;gap:10px}
.olock i{width:190px;height:190px;background-size:contain;background-repeat:no-repeat;background-position:center}
.olock b{font-family:Anton;font-weight:400;font-size:150px}
.olock .vs{font-family:Anton;font-size:44px;color:#c6ff3d;letter-spacing:.2em}
.brand{position:absolute;left:0;right:0;top:860px;text-align:center}
.brand .r{width:110px;height:110px;margin:0 auto 18px;border-radius:50%;border:8px solid #c6ff3d;position:relative;box-shadow:0 0 50px rgba(198,255,61,.55)}
.brand .r:after{content:'';position:absolute;inset:26px;border-radius:50%;background:#c6ff3d}
.brand b{font-family:Anton;font-weight:400;font-size:76px;letter-spacing:.05em}.brand b em{font-style:normal;color:#c6ff3d}
.brand p{margin-top:12px;font-size:28px;letter-spacing:.3em;font-weight:700;color:#c9ced6}
#fade{position:absolute;inset:0;background:#000;z-index:40;opacity:0}
</style></head><body><div id="stage">
<div id="bg"></div><div id="streaks"></div>
<div id="scene"></div>
<div id="bug"><div class="logo"></div><b><em>SMASH</em> NEWS</b><span style="opacity:.8">NFL RECAP</span><span class="tag" id="wk"></span></div>
<div id="grain"></div><div id="vig"></div>
<div id="wipe"></div><div id="flash"></div><div id="fade"></div>
</div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const oc = (p) => 1 - Math.pow(1 - p, 3);
const oexp = (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
const oback = (p) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
let S, SC, cur = -1;
const hexA = (h, a) => { const n = parseInt((h || '#333333').slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const logo = (team) => (team.logoData ? `background-image:url(${team.logoData})` : '');
const team = (abbr) => (S.away.abbr === abbr ? S.away : S.home);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const QL = ['', '1ST', '2ND', '3RD', '4TH', 'OT', '2OT'];

function parseStats(v) {
  const out = []; const s = String(v || '');
  let m;
  if ((m = s.match(/(\d+)\/(\d+)/))) out.push([`${m[1]}/${m[2]}`, 'COMP/ATT', null]);
  if ((m = s.match(/(\d+)\s*CAR/i))) out.push([m[1], 'CARRIES', +m[1]]);
  if ((m = s.match(/(\d+)\s*REC/i))) out.push([m[1], 'CATCHES', +m[1]]);
  if ((m = s.match(/(-?\d+)\s*YDS/i))) out.push([m[1], 'YARDS', +m[1]]);
  if ((m = s.match(/(\d+)\s*TD/i))) out.push([m[1], m[1] === '1' ? 'TOUCHDOWN' : 'TOUCHDOWNS', +m[1]]);
  if ((m = s.match(/(\d+)\s*INT/i))) out.push([m[1], 'INT', +m[1]]);
  return out.slice(0, 3);
}

window.setup = (d) => {
  S = d.spec; SC = d.scenes;
  $('#wk').textContent = S.week ? `WEEK ${S.week}` : 'FINAL';
  const st = $('#streaks');
  for (let i = 0; i < 7; i++) { const e = document.createElement('i'); e.style.width = `${30 + (i * 37) % 90}px`; st.append(e); }
};

const BUILD = {
  open() {
    return `<div class="slab" id="sa" style="background:linear-gradient(90deg,${S.away.color},${hexA(S.away.color, .6)})"></div>
      <div class="slab" id="sb" style="background:linear-gradient(270deg,${S.home.color},${hexA(S.home.color, .6)})"></div>
      <div class="final anton" id="fin">FINAL</div><div class="osub" id="osub"><em>SMASH</em> NEWS · NFL RECAP</div>`;
  },
  intro() {
    const W = S.winner;
    const half = (k, top) => {
      const t = S[k];
      const flip = k === 'home';
      return `<div class="half" id="h-${k}" style="top:${top}px;background:linear-gradient(${flip ? 300 : 120}deg,${hexA(t.color, 1)} 0%,${hexA(t.color, .55)} 60%,#07080b 100%)">
        <div class="logo" id="lg-${k}" style="${logo(t)};${flip ? 'right:24px' : 'left:24px'};top:${flip ? 210 : 150}px"></div>
        <div class="nm anton" style="${flip ? 'left:46px' : 'right:46px;text-align:right'};top:${flip ? 150 : 210}px">${esc(t.name)}</div>
        <div class="city" style="${flip ? 'left:50px' : 'right:50px;text-align:right'};top:${flip ? 108 : 318}px">${esc((t.full || '').replace(t.name, '').trim().toUpperCase())}</div>
        <div class="sc anton" id="sc-${k}" style="${flip ? 'left:46px' : 'right:46px;text-align:right'};top:${flip ? 270 : 340 - 10}px">0</div>
        ${t.record ? `<div class="rec" style="${flip ? 'left:50px' : 'right:50px'};top:${flip ? 530 : 70 + 470}px">${esc(t.record)}</div>` : ''}
        ${k === W ? `<div class="win" id="win" style="${flip ? 'left:300px' : 'right:300px'};top:${flip ? 380 : 440}px">WIN</div>` : ''}
      </div>`;
    };
    return `${half('away', 0)}${half('home', 640)}<div class="divider"><span>FINAL</span></div>`;
  },
  box() {
    const q = Math.max(S.away.linescores.length, S.home.linescores.length);
    const hd = Array.from({ length: q }, (_, i) => `<div class="c">${i < 4 ? `Q${i + 1}` : 'OT'}</div>`).join('');
    const row = (k) => { const t = S[k]; const w = S.winner === k;
      return `<div class="row" id="r-${k}" style="border-left:12px solid ${t.color}"><div class="team"><i style="${logo(t)}"></i>${esc(t.abbr)}</div>
        ${Array.from({ length: q }, (_, i) => `<div class="c pop" data-i="${i}">${t.linescores[i] ?? 0}</div>`).join('')}
        <div class="c t pop" data-i="${q}" style="${w ? 'background:#c6ff3d;color:#0b1100' : ''}">${esc(t.score)}</div></div>`; };
    return `<div class="ttl anton" id="ttl">Quarter by<br>quarter</div><div class="grid"><div class="row hd"><div class="team"></div>${hd}<div class="c t">T</div></div>${row('away')}${row('home')}</div>`;
  },
  play(i) {
    const p = S.plays[i]; const t = team(p.team);
    const word = /touchdown/i.test(p.type) || p.abbr === 'TD' ? 'TOUCHDOWN' : /field goal/i.test(p.type) ? 'FIELD GOAL' : /safety/i.test(p.type) ? 'SAFETY' : (p.type || 'SCORE').toUpperCase();
    const fs = Math.min(168, Math.floor(610 / (word.length * 0.47)));
    const txt = String(p.text).replace(/\s*\((?:[^()]|\([^()]*\))*\)\s*$/, '').replace(/\bYd\b/g, 'YD');
    const words = txt.split(/\s+/).map((w) => `<span>${esc(w)}</span>`).join(' ');
    const prev = i ? S.plays[i - 1] : { away: 0, home: 0 };
    return `<div class="wm" style="${logo(t)}"></div>
      <div class="chip" id="chip"><em>${QL[p.period] || ''}</em> QTR · ${esc(p.clock)} LEFT</div>
      <div class="big anton trail" id="tr2" style="font-size:${fs}px;color:${hexA(t.alt || '#ffffff', 1)}">${word}</div>
      <div class="big anton trail" id="tr1" style="font-size:${fs}px">${word}</div>
      <div class="big anton" id="bw" style="font-size:${fs}px">${word}</div>
      <div class="who" id="who" style="top:${250 + fs + 30}px"><span style="color:#c6ff3d">▶</span> ${esc((t.full || t.name).toUpperCase())}</div>
      <div class="ptext" id="pt" style="top:${250 + fs + 110}px">${words}</div>
      <div class="sbar" id="sbar"><i style="${logo(S.away)}"></i><span class="ab">${esc(S.away.abbr)}</span><span class="s" id="s-away" data-a="${prev.away}" data-b="${p.away}">${prev.away}</span>
        <span class="mid">${QL[p.period] || ''} · ${esc(p.clock)}</span>
        <span class="s" id="s-home" data-a="${prev.home}" data-b="${p.home}">${prev.home}</span><span class="ab">${esc(S.home.abbr)}</span><i style="${logo(S.home)}"></i></div>
      <div class="dots">SCORING PLAY ${i + 1} / ${S.plays.length}</div>`;
  },
  stats() {
    const a = +S.stats.away.yards || 0, h = +S.stats.home.yards || 0, m = Math.max(a, h, 1);
    return `<div class="ttl anton" id="ttl">By the<br>numbers</div>
      <div class="st" style="top:420px"><h4>TOTAL YARDS</h4>
        <div class="bar" id="ba" data-w="${a / m}" data-v="${a}" style="background:linear-gradient(90deg,${S.away.color},${hexA(S.away.color, .7)})"><span>${esc(S.away.abbr)}</span><span class="v">0</span></div>
        <div class="bar" id="bh" data-w="${h / m}" data-v="${h}" style="background:linear-gradient(90deg,${S.home.color},${hexA(S.home.color, .7)})"><span>${esc(S.home.abbr)}</span><span class="v">0</span></div></div>
      <div class="st" style="top:760px"><h4>TURNOVERS</h4><div class="tov">
        <div id="ta" style="border-top:8px solid ${S.away.color}"><b>${esc(S.stats.away.turnovers ?? '0')}</b><span>${esc(S.away.abbr)}</span></div>
        <div id="th" style="border-top:8px solid ${S.home.color}"><b>${esc(S.stats.home.turnovers ?? '0')}</b><span>${esc(S.home.abbr)}</span></div></div></div>`;
  },
  leader(i) {
    const l = S.leaders[i];
    const parts = String(l.player).split(' ');
    const last = parts.length > 1 ? parts.slice(1).join(' ') : parts[0];
    const first = parts.length > 1 ? parts[0] : '';
    const fs = last.length > 9 ? Math.max(96, Math.floor(1500 / last.length)) : 170;
    const tiles = parseStats(l.value).map(([v, k, n], j) => `<div class="tile" id="tl${j}"><b data-n="${n ?? ''}" data-v="${esc(v)}">${esc(v)}</b><span>${k}</span></div>`).join('');
    const lab = i === 0 ? 'PLAYER OF THE GAME' : l.intro.toUpperCase();
    return `<div class="lab" id="lab">${lab}<em>${esc(l.label || '')}</em></div><div class="slash" id="sl"></div>
      <div class="fn" id="fn">${esc(first.toUpperCase())}</div><div class="ln anton" id="ln" style="font-size:${fs}px">${esc(last)}</div>
      <div class="pos" id="pos">${esc([l.position, l.team].filter(Boolean).join(' · '))}</div><div class="tiles">${tiles}</div>`;
  },
  outro() {
    const t = (k) => `<div class="t"><i style="${logo(S[k])}"></i><b style="${S.winner === k ? 'color:#c6ff3d' : 'opacity:.6'}">${esc(S[k].score)}</b></div>`;
    return `${t('away')}`.replace(/^/, '<div class="olock" id="ol">') + `<div class="vs">FINAL</div>${t('home')}</div>
      <div class="brand" id="br"><div class="r"></div><b><em>SMASH</em> NEWS</b><p>EVERY GAME · EVERY WEEK</p></div>`;
  },
};

function bgFor(name) {
  if (name.startsWith('play')) { const t = team(S.plays[+name.slice(4)].team); return `radial-gradient(90% 70% at 70% 30%,${hexA(t.color, .95)},${hexA(t.color, .35)} 55%,#07080b 100%)`; }
  if (name === 'open') return '#07080b';
  if (name.startsWith('leader')) return `linear-gradient(160deg,${hexA(S[S.winner].color, .85)},#07080b 65%)`;
  return `linear-gradient(160deg,${hexA(S.away.color, .55)},#07080b 45%,#07080b 55%,${hexA(S.home.color, .55)})`;
}

const ANIM = {
  open(lt) {
    const p = oc(seg(lt, 0, 0.45));
    $('#sa').style.transform = `skewX(-12deg) translateX(${lerp(-120, -58, p)}%)`;
    $('#sb').style.transform = `skewX(-12deg) translateX(${lerp(120, 58, p)}%)`;
    const f = seg(lt, 0.42, 0.68);
    const fin = $('#fin');
    fin.style.opacity = lt < 0.42 ? 0 : 1;
    fin.style.transform = `scale(${lerp(2.6, 1, oexp(f))}) skewX(-8deg)`;
    fin.style.filter = `blur(${lerp(16, 0, f)}px)`;
    const o = seg(lt, 0.85, 1.25);
    $('#osub').style.clipPath = `inset(0 ${100 - o * 100}% 0 0)`;
    $('#flash').style.opacity = lt > 0.44 ? Math.max(0, 0.85 - (lt - 0.44) * 4) : 0;
    const shake = lt > 0.44 && lt < 0.7 ? (0.7 - lt) * 40 : 0;
    $('#scene').style.transform = `translate(${Math.sin(lt * 90) * shake}px,${Math.cos(lt * 70) * shake}px)`;
  },
  intro(lt) {
    const p = oc(seg(lt, 0, 0.45));
    $('#h-away').style.transform = `translateX(${lerp(-100, 0, p)}%)`;
    $('#h-home').style.transform = `translateX(${lerp(100, 0, p)}%)`;
    for (const k of ['away', 'home']) {
      const lp = oback(seg(lt, 0.25, 0.8));
      $(`#lg-${k}`).style.transform = `scale(${lerp(0.4, 1, lp)}) translateY(${Math.sin(lt * 1.6 + (k === 'home' ? 1.5 : 0)) * 8}px)`;
      const c = oc(seg(lt, 0.6, 1.8));
      const fin = +S[k].score || 0;
      const sc = $(`#sc-${k}`);
      sc.textContent = Math.round(fin * c);
      const lose = S.winner !== k;
      sc.style.opacity = lose ? lerp(1, 0.55, seg(lt, 2.0, 2.4)) : 1;
      if (!lose) sc.style.textShadow = `0 0 ${lerp(0, 50, seg(lt, 1.8, 2.2))}px rgba(198,255,61,.9)`;
    }
    const w = $('#win'); if (w) { const q = seg(lt, 1.85, 2.2); w.style.opacity = q > 0 ? 1 : 0; w.style.transform = `scale(${lerp(2.2, 1, oback(q))}) rotate(-6deg)`; }
  },
  box(lt) {
    $('#ttl').style.setProperty('--w', `${oc(seg(lt, 0.1, 0.5)) * 300}px`);
    $('#ttl').style.clipPath = `inset(0 ${100 - oc(seg(lt, 0, 0.35)) * 100}% 0 0)`;
    ['away', 'home'].forEach((k, r) => {
      const p = oc(seg(lt, 0.2 + r * 0.12, 0.6 + r * 0.12));
      $(`#r-${k}`).style.transform = `translateX(${lerp(110, 0, p)}%)`;
      $(`#r-${k}`).querySelectorAll('.pop').forEach((c) => {
        const q = seg(lt, 0.6 + (+c.dataset.i * 2 + r) * 0.09, 0.85 + (+c.dataset.i * 2 + r) * 0.09);
        c.style.opacity = q; c.style.transform = `scale(${lerp(1.8, 1, oback(q))})`;
      });
    });
  },
  play(lt) {
    const c = oc(seg(lt, 0, 0.3)); $('#chip').style.transform = `translateY(${lerp(-200, 0, c)}px)`;
    const b = oexp(seg(lt, 0.05, 0.55));
    const x = lerp(760, 0, b);
    $('#bw').style.transform = `translateX(${x}px) skewX(-10deg) scale(${1 + seg(lt, 0.55, 6) * 0.04})`;
    $('#tr1').style.transform = `translateX(${x * 1.25 + 26 * (1 - seg(lt, 0.5, 0.9))}px) skewX(-10deg)`;
    $('#tr2').style.transform = `translateX(${x * 1.5 + 52 * (1 - seg(lt, 0.5, 0.9))}px) skewX(-10deg)`;
    $('#tr1').style.opacity = 0.22 * (1 - seg(lt, 0.6, 1.0)) + 0.04;
    $('#tr2').style.opacity = 0.14 * (1 - seg(lt, 0.6, 1.0));
    $('#who').style.clipPath = `inset(0 ${100 - oc(seg(lt, 0.4, 0.75)) * 100}% 0 0)`;
    document.querySelectorAll('#pt span').forEach((s, i) => { const q = oc(seg(lt, 0.55 + i * 0.045, 0.85 + i * 0.045)); s.style.opacity = q; s.style.transform = `translateY(${lerp(30, 0, q)}px)`; });
    const sb = oc(seg(lt, 0.3, 0.65)); $('#sbar').style.transform = `translateY(${lerp(320, 0, sb)}px)`;
    for (const k of ['away', 'home']) {
      const e = $(`#s-${k}`); const a = +e.dataset.a, bb = +e.dataset.b;
      if (a !== bb) {
        const q = seg(lt, 1.0, 1.35);
        e.textContent = q > 0.5 ? bb : a;
        e.style.transform = `scale(${q > 0 && q < 1 ? 1 + Math.sin(q * Math.PI) * 0.55 : 1})`;
        e.style.color = q > 0.5 ? `rgba(198,255,61,${1 - seg(lt, 1.6, 2.6) * 0.0})` : '#fff';
        e.style.textShadow = q > 0.5 ? `0 0 ${lerp(40, 10, seg(lt, 1.35, 2.5))}px rgba(198,255,61,.8)` : 'none';
      }
    }
  },
  stats(lt) {
    $('#ttl').style.setProperty('--w', `${oc(seg(lt, 0.1, 0.5)) * 300}px`);
    $('#ttl').style.clipPath = `inset(0 ${100 - oc(seg(lt, 0, 0.35)) * 100}% 0 0)`;
    for (const [id, d] of [['#ba', 0], ['#bh', 0.15]]) {
      const e = $(id); const p = oc(seg(lt, 0.35 + d, 1.4 + d));
      e.style.width = `${lerp(18, 100, (+e.dataset.w) * p)}%`;
      e.querySelector('.v').textContent = Math.round(+e.dataset.v * p);
    }
    for (const [id, d] of [['#ta', 0], ['#th', 0.12]]) { const q = oback(seg(lt, 1.2 + d, 1.6 + d)); $(id).style.transform = `scale(${lerp(0.3, 1, q)})`; $(id).style.opacity = seg(lt, 1.2 + d, 1.4 + d); }
  },
  leader(lt) {
    $('#lab').style.clipPath = `inset(0 ${100 - oc(seg(lt, 0, 0.35)) * 100}% 0 0)`;
    const s = oexp(seg(lt, 0.05, 0.5)); $('#sl').style.transform = `skewY(-9deg) translateX(${lerp(-100, 0, s)}%)`;
    const f = oc(seg(lt, 0.2, 0.55)); $('#fn').style.transform = `translateX(${lerp(-700, 0, f)}px)`;
    const l = oexp(seg(lt, 0.28, 0.7)); $('#ln').style.transform = `translateX(${lerp(800, 0, l)}px) skewX(-8deg) scale(${1 + seg(lt, 0.7, 5) * 0.03})`;
    $('#pos').style.opacity = seg(lt, 0.6, 0.9);
    document.querySelectorAll('.tile').forEach((t, i) => {
      const q = seg(lt, 0.7 + i * 0.16, 1.05 + i * 0.16);
      t.style.opacity = q; t.style.transform = `translateY(${lerp(80, 0, oc(q))}px) scale(${lerp(0.8, 1, oback(q))})`;
      const b = t.querySelector('b'); const n = b.dataset.n;
      if (n !== '') b.textContent = Math.round(+n * oc(seg(lt, 0.8 + i * 0.16, 1.7 + i * 0.16)));
    });
  },
  outro(lt, dur) {
    const p = oback(seg(lt, 0.05, 0.6)); $('#ol').style.transform = `scale(${lerp(0.6, 1, p)})`; $('#ol').style.opacity = seg(lt, 0.05, 0.3);
    const b = oc(seg(lt, 0.5, 1.0)); $('#br').style.transform = `translateY(${lerp(120, 0, b)}px)`; $('#br').style.opacity = b;
    $('#fade').style.opacity = seg(lt, dur - 0.7, dur);
  },
};

window.frame = (t) => {
  let i = SC.findIndex((s) => t < s.start + s.dur); if (i < 0) i = SC.length - 1;
  const sc = SC[i]; const lt = t - sc.start;
  const base = sc.name.replace(/\d+$/, ''); const idx = +(sc.name.match(/\d+$/) || [0])[0];
  if (i !== cur) {
    cur = i;
    $('#scene').style.transform = '';
    $('#scene').innerHTML = BUILD[base](idx);
    $('#bg').style.background = bgFor(sc.name);
  }
  ANIM[base](lt, sc.dur);
  // ambient motion
  document.querySelectorAll('#streaks i').forEach((e, k) => { e.style.left = `${((k * 173 + t * (60 + k * 25)) % 1100) - 200}px`; e.style.opacity = 0.35 + 0.25 * Math.sin(t * 1.3 + k); });
  $('#bg').style.transform = `scale(${1.05 + Math.sin(t * 0.4) * 0.03}) rotate(${Math.sin(t * 0.25) * 1.2}deg)`;
  $('#grain').style.transform = `translate(${(t * 997) % 37 - 18}px,${(t * 631) % 41 - 20}px)`;
  $('#bug').style.opacity = seg(t, 1.3, 1.7);
  // lime wipe across every cut
  const wipe = $('#wipe'); let shown = false;
  for (let k = 1; k < SC.length; k++) {
    const d = t - SC[k].start;
    if (d > -0.2 && d < 0.2) { const q = (d + 0.2) / 0.4; wipe.style.left = `${lerp(-90, 130, q)}%`; shown = true; break; }
  }
  wipe.style.display = shown ? 'block' : 'none';
};
</script></body></html>
