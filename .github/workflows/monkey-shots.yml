# Monkey's Life — renders the shots of the film on many runners at once.
#   mode plates : one job per plate (the swamp without Seven, once per camera position). Each is kept on its own branch  mp/<quality>/<shot>
#   mode frames : one job per run of frames. It fetches the plate, renders Seven over it, packs the frames into one
#                 nearly lossless video and keeps that on its own branch  mf/<quality>/<shot>_<first>-<last>_<step>
# Free text only ever reaches the scripts through environment variables.
name: Monkey shots
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plates or frames'
        required: true
        default: 'plates'
      matrix:
        description: 'JSON: {"include": [{"shot": "s03_rise", "range": "1:24", "variant": "", "os": "ubuntu-24.04"}]}'
        required: true
      quality:
        description: 'draft / preview / final'
        default: 'preview'
      step:
        description: 'Render every n-th frame'
        default: '1'
permissions:
  contents: write
jobs:
  render:
    runs-on: ${{ matrix.os || 'ubuntu-24.04' }}
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix) }}
    env:
      ML_MODE: '${{ inputs.mode }}'
      ML_SHOT: '${{ matrix.shot }}'
      ML_RANGE: '${{ matrix.range }}'
      ML_VARIANT: '${{ matrix.variant }}'
      ML_QUALITY: '${{ inputs.quality }}'
      ML_STEP: '${{ inputs.step }}'
      ML_REPO: 'https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip, cache-dependency-path: MONKEYS_LIFE/requirements.txt }
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libxkbcommon0 libegl1 ffmpeg >/dev/null
      - name: Blender
        run: pip install -q -r MONKEYS_LIFE/requirements.txt
      - name: Scene assets
        run: |
          rm -rf MONKEYS_LIFE/assets/scene && git clone -q --depth 1 -b monkey-assets "https://github.com/${{ github.repository }}.git" MONKEYS_LIFE/assets/scene
          find MONKEYS_LIFE/assets/scene -name '*.part-00' | while read -r f; do b="${f%.part-00}"; cat "$b".part-* > "$b" && rm "$b".part-*; done
      - name: Render
        run: python MONKEYS_LIFE/blender/ci.py film
      - name: Keep the result on its own branch
        if: ${{ always() }}
        run: python MONKEYS_LIFE/blender/ci.py keep
