# SMASH RADAR — free hosting: GitHub Actions sweeps the sources on a schedule and publishes to GitHub Pages.
# Publishes to the gh-pages branch (GitHub Pages serves it automatically).
name: SMASH RADAR sweep

on:
  schedule:
    - cron: '*/10 * * * *'   # GitHub may delay scheduled runs a few minutes at busy times
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: smash-radar
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The radar's memory (seen stories, change history, source health) carries over between runs.
      - name: Restore radar memory
        uses: actions/cache/restore@v4
        with:
          path: data
          key: radar-state-v5-${{ github.run_id }}
          restore-keys: radar-state-v5-

      - name: Sweep sources + build site
        run: node scripts/build-static.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENRICH_LIMIT: '90'
          STATIC_MAX_STORIES: '3000'

      # ---- Instagram auto-post (off until IG secrets are added) ----
      - name: Auto-post — plan
        id: plan
        run: node scripts/autopost.js plan
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          AUTOPOST_MAX_PER_DAY: ${{ vars.AUTOPOST_MAX_PER_DAY }}
          AUTOPOST_MIN_GAP_MINUTES: ${{ vars.AUTOPOST_MIN_GAP_MINUTES }}
          AUTOPOST_QUIET_HOURS: ${{ vars.AUTOPOST_QUIET_HOURS }}
          AUTOPOST_RECAP_HOUR: ${{ vars.AUTOPOST_RECAP_HOUR }}
          AUTOPOST_RECAP: ${{ vars.AUTOPOST_RECAP }}
          AUTOPOST_WEEKLY: ${{ vars.AUTOPOST_WEEKLY }}
          AUTOPOST_SINGLES: ${{ vars.AUTOPOST_SINGLES }}

      - name: Auto-post — render images
        if: steps.plan.outputs.has_posts == 'true'
        run: |
          sudo apt-get install -y -qq fonts-noto-color-emoji > /dev/null
          npm i --no-save --silent playwright@1.56
          npx playwright install --with-deps chromium > /dev/null
          node scripts/autopost.js render
        env:
          AUTOPOST_PHOTOS: ${{ vars.AUTOPOST_PHOTOS }}
          AUTOPOST_FORMAT: ${{ vars.AUTOPOST_FORMAT }}

      - name: Publish to gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "smash-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Radar sweep $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Auto-post — publish to Instagram
        if: steps.plan.outputs.has_posts == 'true'
        run: node scripts/autopost.js publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Save radar memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: radar-state-v5-${{ github.run_id }}
