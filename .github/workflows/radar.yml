# SMASH NEWS live loop — updates the app every 10 minutes, all day.
# One run loops for ~5.5 hours (an update every 10 minutes), then starts the next run itself.
# The hourly schedule is only a backup that restarts the loop if it ever stops.
name: SMASH NEWS live loop

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: smash-radar
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the lion's voice
        run: pip install -q edge-tts

      - name: Restore radar memory (older cache)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: radar-state-v5-${{ github.run_id }}
          restore-keys: radar-state-v5-

      - name: Restore radar memory (latest)
        run: |
          if git fetch -q --depth 1 origin radar-data 2>/dev/null; then
            git show FETCH_HEAD:state.tgz > /tmp/state.tgz && tar xzf /tmp/state.tgz && echo "memory restored"
          else
            echo "no saved memory yet"
          fi

      - name: Update every 10 minutes
        run: cp scripts/loop.sh /tmp/loop.sh && bash /tmp/loop.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ENRICH_LIMIT: '150'
          STATIC_MAX_STORIES: '3000'
          SWEEP_BUDGET_MS: '420000'
          FAST_INTERVAL_MINUTES: '5'
          NORMAL_INTERVAL_MINUTES: '10'
          SLOW_INTERVAL_MINUTES: '30'
          AUTOPOST_MAX_PER_DAY: ${{ vars.AUTOPOST_MAX_PER_DAY }}
          AUTOPOST_RECAP: ${{ vars.AUTOPOST_RECAP }}
          AUTOPOST_WEEKLY: ${{ vars.AUTOPOST_WEEKLY }}
          AUTOPOST_PHOTOS: ${{ vars.AUTOPOST_PHOTOS }}
