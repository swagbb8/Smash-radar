name: THE TRUTH probe
on:
  workflow_dispatch:
    inputs:
      models:
        description: 'comma-separated model ids to test'
        default: ''
permissions:
  contents: write
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Probe services
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
          PROBE_MODELS: ${{ inputs.models }}
        run: if [ "${{ inputs.models }}" = "debug" ]; then node truth/engine/probe-models.mjs; elif [ "${{ inputs.models }}" = "hf" ]; then node truth/engine/probe-hf.mjs; else node truth/engine/probe.mjs; fi
      - name: Save result to the truth-probe branch
        run: |
          cd probe-out && git init -q -b truth-probe && git config user.name "truth-bot" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "probe $(date -u +%FT%TZ)" && git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" truth-probe
