# Monkey's Life — renders still pictures of Seven (look development) on several runners at once and keeps them on the
# branch `monkey-renders`. Input: a JSON list, one entry per picture: [{"name": "face", "args": "--fur --cam face"}]
name: Monkey look
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: 'JSON list of {"name", "args"} (arguments of MONKEYS_LIFE/blender/studio.py)'
        required: true
      assets:
        description: 'Fetch the scene assets branch too (yes/no)'
        default: 'no'
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env: { ML_JOBS: '${{ inputs.jobs }}' }
        run: python3 MONKEYS_LIFE/blender/ci.py plan
  render:
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip, cache-dependency-path: MONKEYS_LIFE/requirements.txt }
      - name: Blender + libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libxkbcommon0 libegl1 >/dev/null
          pip install -q -r MONKEYS_LIFE/requirements.txt
      - name: Scene assets
        if: ${{ inputs.assets == 'yes' }}
        run: |
          git clone -q --depth 1 -b monkey-assets "https://github.com/${{ github.repository }}.git" MONKEYS_LIFE/assets/scene
          find MONKEYS_LIFE/assets/scene -name '*.part-00' | while read -r f; do b="${f%.part-00}"; cat "$b".part-* > "$b" && rm "$b".part-*; done
      - name: Render ${{ matrix.name }}
        env: { ML_NAME: '${{ matrix.name }}', ML_ARGS: '${{ matrix.args }}', ML_TOOL: '${{ matrix.tool }}' }
        run: python MONKEYS_LIFE/blender/ci.py still
      - name: Save to the monkey-renders branch (each picture as soon as it is done)
        if: ${{ always() }}
        run: |
          [ -n "$(ls out 2>/dev/null)" ] || exit 0
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          for try in 1 2 3 4 5 6 7 8; do
            rm -rf keep && (git clone -q --depth 1 -b monkey-renders "$url" keep 2>/dev/null || (mkdir keep && cd keep && git init -q -b monkey-renders && git remote add origin "$url"))
            cp out/* keep/ && cd keep && git config user.name "monkey-bot" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A && (git diff --cached --quiet || git commit -qm "${{ matrix.name }} (run ${{ github.run_number }})")
            if git push -q origin monkey-renders 2>/dev/null; then echo saved; exit 0; fi
            cd .. && sleep $((RANDOM % 7 + 2))
          done
          echo "::error::could not save ${{ matrix.name }}"; exit 1
