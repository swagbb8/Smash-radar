# Monkey's Life — renders still pictures of Seven (look development) on several runners at once and keeps them on the
# branch `monkey-renders`. One job per picture; free text only ever reaches the scripts through environment variables.
name: Monkey look
on:
  workflow_dispatch:
    inputs:
      matrix:
        description: 'JSON: {"include": [{"name": "face", "args": "--fur --cam face", "tool": "studio|sheet|swamp", "os": "ubuntu-24.04"}]}'
        required: true
      assets:
        description: 'Fetch the scene assets branch too (yes/no)'
        default: 'no'
      os:
        description: 'Runner for jobs that do not name one (ubuntu-22.04, ubuntu-24.04, macos-15, windows-latest)'
        default: 'ubuntu-24.04'
      device:
        description: 'auto / cpu / gpu'
        default: 'auto'
permissions:
  contents: write
jobs:
  render:
    runs-on: ${{ matrix.os || inputs.os || 'ubuntu-24.04' }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip, cache-dependency-path: MONKEYS_LIFE/requirements.txt }
      - name: System libraries (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libxkbcommon0 libegl1 >/dev/null
      - name: Blender
        run: pip install -q -r MONKEYS_LIFE/requirements.txt
      - name: Scene assets
        if: ${{ inputs.assets == 'yes' }}
        run: |
          rm -rf MONKEYS_LIFE/assets/scene && git clone -q --depth 1 -b monkey-assets "https://github.com/${{ github.repository }}.git" MONKEYS_LIFE/assets/scene
          find MONKEYS_LIFE/assets/scene -name '*.part-00' | while read -r f; do b="${f%.part-00}"; cat "$b".part-* > "$b" && rm "$b".part-*; done
      - name: Render ${{ matrix.name }}
        env: { ML_NAME: '${{ matrix.name }}', ML_ARGS: '${{ matrix.args }}', ML_TOOL: '${{ matrix.tool }}', ML_DEVICE: '${{ inputs.device }}' }
        run: python MONKEYS_LIFE/blender/ci.py still
      - name: Save to the monkey-renders branch (each picture as soon as it is done)
        if: ${{ always() }}
        env: { ML_NAME: '${{ matrix.name }}' }
        run: |
          [ -n "$(ls out 2>/dev/null)" ] || exit 0
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          for try in 1 2 3 4 5 6 7 8; do
            rm -rf keep && (git clone -q --depth 1 -b monkey-renders "$url" keep 2>/dev/null || (mkdir keep && cd keep && git init -q -b monkey-renders && git remote add origin "$url"))
            cp out/* keep/ && cd keep && git config user.name "monkey-bot" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A && (git diff --cached --quiet || git commit -qm "$ML_NAME (run ${{ github.run_number }})")
            if git push -q origin monkey-renders 2>/dev/null; then echo saved; exit 0; fi
            cd .. && sleep $((RANDOM % 7 + 2))
          done
          echo "::error::could not save $ML_NAME"; exit 1
