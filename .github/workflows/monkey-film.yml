# Monkey's Life — cuts the film once every run of frames is in: waits for them, fetches them, builds the soundtrack, edits,
# and keeps the result on the branch `monkey-film` (arise_<quality>.mp4). Start it right after the frames; it needs nobody.
name: Monkey film
on:
  workflow_dispatch:
    inputs:
      quality:
        description: 'preview / final'
        default: 'final'
      size:
        description: 'Size of the film'
        default: '1280x536'
      wait:
        description: 'Minutes to wait for frames at most'
        default: '330'
permissions:
  contents: write
jobs:
  cut:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      ML_QUALITY: '${{ inputs.quality }}'
      ML_SIZE: '${{ inputs.size }}'
      ML_WAIT: '${{ inputs.wait }}'
      ML_REPO: 'https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip, cache-dependency-path: MONKEYS_LIFE/requirements.txt }
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libxkbcommon0 libegl1 ffmpeg >/dev/null
          pip install -q -r MONKEYS_LIFE/requirements.txt opencv-python-headless
      - name: Wait for the frames, then cut the film
        run: python MONKEYS_LIFE/blender/ci.py assemble
      - name: Keep the film on its own branch
        if: ${{ always() }}
        run: python MONKEYS_LIFE/blender/ci.py keep
